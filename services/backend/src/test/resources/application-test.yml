spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: TEST_SECRET_FOR_JWT            # static secret for unit tests
  expiration: 600000                    # 10 min

# Disable real security filter-chain for most unit tests;
# integration-security tests override this profile.
security:
  enabled: false
